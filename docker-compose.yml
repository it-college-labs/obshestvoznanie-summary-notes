services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neuroarchive
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro -d neuroarchive"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - neuroarchive

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - BASE_URL=${BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - SECURE_COOKIE=${SECURE_COOKIE:-false}
    volumes:
      - ./data/uploads:/app/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - neuroarchive

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    volumes:
      - ./dist:/srv/frontend
      - ./data/Caddyfile.local:/etc/caddy/Caddyfile
    depends_on:
      - backend
    networks:
      - neuroarchive

networks:
  neuroarchive:
    driver: bridge
